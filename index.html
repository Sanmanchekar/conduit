<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conduit</title>
<meta name="description" content="Conduit — connect matching dots with pipes that never cross and fill every cell. 360 levels from 5×5 to 10×10.">
<meta name="theme-color" content="#11131b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311131b'/%3E%3Cpath d='M8 8v10a6 6 0 0 0 6 6h10' fill='none' stroke='%23ff8a1f' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='8' r='4.5' fill='%23ff8a1f'/%3E%3Ccircle cx='24' cy='24' r='4.5' fill='%23ff8a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand">Conduit</h1>
    <button class="pill" id="open-levels" type="button" aria-haspopup="dialog">
      <span id="level-label">5×5 · Level 1</span>
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <dl class="stats" aria-live="polite">
    <div><dt>Flows</dt><dd id="s-flows">0/0</dd></div>
    <div><dt>Moves</dt><dd id="s-moves">0</dd></div>
    <div><dt>Best</dt><dd id="s-best">—</dd></div>
    <div><dt>Pipe</dt><dd id="s-pipe">0%</dd></div>
  </dl>

  <div class="board-wrap" id="board-wrap">
    <canvas id="board" aria-label="Puzzle board. Drag from a dot to its matching dot." role="img"></canvas>
  </div>

  <nav class="controls" aria-label="Game controls">
    <button type="button" class="ctl" id="b-prev" title="Previous level (P)" aria-label="Previous level">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="ctl" id="b-undo" title="Undo (U or Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 7H5V3"/><path d="M5.5 7.5A8 8 0 1 1 4 13"/></svg><span>Undo</span></button>
    <button type="button" class="ctl" id="b-reset" title="Clear the board (R)"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v4h4"/></svg><span>Reset</span></button>
    <button type="button" class="ctl" id="b-hint" title="Lay one correct pipe (H)"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.5.4.8 1 .8 1.7V16h5.6v-.5c0-.7.3-1.3.8-1.7A6 6 0 0 0 12 3z"/></svg><span>Hint</span></button>
    <button type="button" class="ctl" id="b-next" title="Next level (N)" aria-label="Next level">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>

  <footer class="foot">
    <label class="toggle"><input type="checkbox" id="opt-letters"> Letters on dots</label>
    <span>Drag from a dot to its twin. Pipes can't cross. Fill every cell.</span>
  </footer>
</div>

<dialog id="levels" aria-labelledby="levels-title">
  <form method="dialog" class="sheet">
    <div class="sheet-head">
      <h2 id="levels-title">Levels</h2>
      <button class="x" value="close" aria-label="Close">×</button>
    </div>
    <div class="tabs" id="size-tabs" role="tablist" aria-label="Grid size"></div>
    <p class="sheet-sub" id="size-progress"></p>
    <div class="grid" id="level-grid"></div>
  </form>
</dialog>

<dialog id="win" aria-labelledby="win-title">
  <form method="dialog" class="sheet win">
    <h2 id="win-title">Solved</h2>
    <p id="win-text"></p>
    <div class="win-actions">
      <button class="ctl" value="replay" id="w-replay">Replay</button>
      <button class="ctl primary" value="next" id="w-next">Next level</button>
    </div>
  </form>
</dialog>

<script src="src/generator.js"></script>
<script src="src/game.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
